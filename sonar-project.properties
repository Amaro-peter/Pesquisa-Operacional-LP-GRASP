# SonarQube analysis configuration for Pesquisa Operacional - LP-GRASP

sonar.projectKey=pesquisa-operacional-lp-grasp
sonar.projectName=Pesquisa Operacional - LP-GRASP UFLP Heuristic
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source and Test directories
sonar.sources=scripts
sonar.tests=tests
sonar.inclusions=scripts/**/*.py
sonar.test.inclusions=tests/**/test_*.py,tests/**/*_test.py

# Exclusions
sonar.exclusions=\
  tests/**,\
  docs/**,\
  images/**,\
  *.png,\
  *.txt,\
  *.md,\
  htmlcov/**,\
  .mutmut-cache/**

# Coverage reporting
sonar.python.coverage.reportPaths=coverage.xml

# SCM integration
sonar.scm.provider=git
